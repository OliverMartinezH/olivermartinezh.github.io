<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Inter','Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAFAF9"/>
      <stop offset="1" stop-color="#ECE9DF"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#185FA5"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Title -->
  <text x="40" y="104" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-size="60" font-weight="700" fill="#185FA5" letter-spacing="-0.02em">Okk_Init</text>
  <text x="42" y="168" font-size="20" fill="#6B6B67">Memoria de largo plazo para agentes de IA</text>
  <text x="42" y="196" font-size="20" fill="#6B6B67">en el desarrollo de software.</text>

  <!-- Platform chip -->
  <rect x="960" y="48" width="280" height="40" rx="20" fill="rgba(24,95,165,0.10)"/>
  <text x="1100" y="74" text-anchor="middle" font-size="15" font-weight="600" fill="#185FA5">OpenCode · Claude Code</text>

  <!-- 6 commands -->
  <text x="40" y="276" font-size="14" font-weight="700" letter-spacing="2" fill="#185FA5">6 COMANDOS</text>
  <g font-family="'Cascadia Code','Consolas',monospace" font-size="16" font-weight="600">
    <rect x="40" y="292" width="270" height="54" rx="27" fill="rgba(24,95,165,0.10)"/>
    <text x="175" y="327" text-anchor="middle" fill="#185FA5">okk init</text>
    <rect x="322" y="292" width="270" height="54" rx="27" fill="rgba(24,95,165,0.10)"/>
    <text x="457" y="327" text-anchor="middle" fill="#185FA5">okk sigamos</text>
    <rect x="40" y="360" width="270" height="54" rx="27" fill="rgba(24,95,165,0.10)"/>
    <text x="175" y="395" text-anchor="middle" fill="#185FA5">okk decide</text>
    <rect x="322" y="360" width="270" height="54" rx="27" fill="rgba(24,95,165,0.10)"/>
    <text x="457" y="395" text-anchor="middle" fill="#185FA5">okk sync</text>
    <rect x="40" y="428" width="270" height="54" rx="27" fill="rgba(24,95,165,0.10)"/>
    <text x="175" y="463" text-anchor="middle" fill="#185FA5">okk status</text>
    <rect x="322" y="428" width="270" height="54" rx="27" fill="rgba(24,95,165,0.10)"/>
    <text x="457" y="463" text-anchor="middle" fill="#185FA5">okk commit</text>
  </g>

  <!-- Files label -->
  <text x="640" y="276" font-size="14" font-weight="700" letter-spacing="2" fill="#185FA5">LOS 4 ARCHIVOS<tspan fill="#6B6B67"> · WIKI-LINKS OBSIDIAN</tspan></text>

  <!-- Arrows -->
  <g stroke="#185FA5" stroke-width="2.5">
    <line x1="898" y1="348" x2="924" y2="348" marker-end="url(#arr)"/>
    <line x1="1055" y1="398" x2="1055" y2="420" marker-end="url(#arr)"/>
    <line x1="765" y1="398" x2="765" y2="420" marker-end="url(#arr)"/>
    <line x1="898" y1="476" x2="924" y2="476" marker-end="url(#arr)"/>
  </g>

  <!-- File cards -->
  <g>
    <rect x="640" y="300" width="250" height="96" rx="14" fill="#FFFFFF" stroke="#E4E1D8"/>
    <text x="660" y="342" font-family="'Cascadia Code','Consolas',monospace" font-size="16" font-weight="700" fill="#2C2C2A">Proyecto.md</text>
    <text x="660" y="368" font-size="13" fill="#6B6B67">Mapa del proyecto</text>

    <rect x="930" y="300" width="250" height="96" rx="14" fill="#FFFFFF" stroke="#E4E1D8"/>
    <text x="950" y="342" font-family="'Cascadia Code','Consolas',monospace" font-size="16" font-weight="700" fill="#2C2C2A">AGENTS.md</text>
    <text x="950" y="368" font-size="13" fill="#6B6B67">Reglas + decisiones</text>

    <rect x="640" y="428" width="250" height="96" rx="14" fill="#FFFFFF" stroke="#E4E1D8"/>
    <text x="660" y="470" font-family="'Cascadia Code','Consolas',monospace" font-size="16" font-weight="700" fill="#2C2C2A">progress.md</text>
    <text x="660" y="496" font-size="13" fill="#6B6B67">Estado + próximo paso</text>

    <rect x="930" y="428" width="250" height="96" rx="14" fill="#FFFFFF" stroke="#E4E1D8"/>
    <text x="950" y="470" font-family="'Cascadia Code','Consolas',monospace" font-size="16" font-weight="700" fill="#2C2C2A">history.md</text>
    <text x="950" y="496" font-size="13" fill="#6B6B67">Memoria de fases</text>
  </g>

  <!-- Footer -->
  <text x="1240" y="688" text-anchor="end" font-size="15" fill="#6B6B67">0 dependencias · setup en segundos · graph en Obsidian</text>
